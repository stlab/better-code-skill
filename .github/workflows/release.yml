name: Plugin release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/scripts/**
      - .github/workflows/release.yml
      - .claude-plugin/**
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/release.yml
      - .claude-plugin/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s .github/scripts/tests -v

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: plugin-release-versions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Update plugin versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/update-plugin-versions.py "$RELEASE_TAG"
      - name: Commit and push manifest versions
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin "refs/heads/${DEFAULT_BRANCH}"
              git checkout --detach FETCH_HEAD
              python .github/scripts/update-plugin-versions.py "$RELEASE_TAG"
            fi
            git add -- .claude-plugin/plugin.json .claude-plugin/marketplace.json
            if git diff --cached --quiet; then
              echo "Plugin versions already match the release."
              exit 0
            fi
            git commit -m "chore: publish plugin version ${RELEASE_TAG}"
            if git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"; then
              exit 0
            fi
            echo "::warning::Manifest push failed on attempt ${attempt} of 3."
          done
          echo "::error::Could not publish plugin versions after 3 attempts."
          exit 1
